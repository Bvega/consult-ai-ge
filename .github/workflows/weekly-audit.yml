# ============================================================
# weekly-audit.yml
# GitHub Action: corre cada viernes 4pm (UTC-4 = 8pm UTC)
# Genera resumen automático del git log de la semana.
# Bolivar solo necesita revisar + aprobar en el chat.
# ============================================================

name: Weekly Audit Summary

on:
  schedule:
    - cron: '0 20 * * 5'   # Every Friday 8pm UTC (4pm Santo Domingo)
  workflow_dispatch:         # También se puede correr manualmente

jobs:
  audit-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Para poder hacer commit del summary

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history para git log

      - name: Generate weekly summary
        id: summary
        run: |
          DATE=$(date +%Y-%m-%d)
          WEEK_NUM=$(date +%V)

          echo "# Auto-Audit: Week $WEEK_NUM ($DATE)" > /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md
          echo "## Git Log — Last 7 Days" >> /tmp/audit-summary.md
          echo '```' >> /tmp/audit-summary.md
          git log --oneline --since="7 days ago" >> /tmp/audit-summary.md
          echo '```' >> /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md

          # Count commits
          COMMIT_COUNT=$(git log --oneline --since="7 days ago" | wc -l)
          echo "## Commit Count: $COMMIT_COUNT" >> /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md

          # Check for model info in commits
          MODEL_COMMITS=$(git log --oneline --since="7 days ago" | grep -c "Sonnet\|Opus\|Claude" || true)
          echo "## Commits with model info: $MODEL_COMMITS / $COMMIT_COUNT" >> /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md

          # Files changed this week
          echo "## Files Changed This Week" >> /tmp/audit-summary.md
          echo '```' >> /tmp/audit-summary.md
          git diff --name-only HEAD~$COMMIT_COUNT HEAD 2>/dev/null || echo "(nothing)" >> /tmp/audit-summary.md
          echo '```' >> /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md

          echo "## Status: Pending Bolivar Review" >> /tmp/audit-summary.md
          echo "" >> /tmp/audit-summary.md
          echo "_Auto-generated by GitHub Actions. Human review required._" >> /tmp/audit-summary.md

          cat /tmp/audit-summary.md

      - name: Append to AUDIT-LOG.md
        run: |
          echo "" >> AUDIT-LOG.md
          echo "---" >> AUDIT-LOG.md
          cat /tmp/audit-summary.md >> AUDIT-LOG.md

      - name: Commit audit summary
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AUDIT-LOG.md
          git diff --cached --quiet || git commit -m "Auto-audit: Weekly summary $(date +%Y-%m-%d) [skip ci]"
          git push
